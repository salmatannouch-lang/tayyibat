<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الطيبات">
<meta name="theme-color" content="#1a3a14">
<title>🌿 Al-Tayyibat</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400;700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--gd:#1a3a14;--gm:#2d5a27;--gl:#4a7c3f;--gp:#e8f5e9;--am:#f4a200;--ap:#fef3cd;--cr:#fdf6e3;--cd:#f0ebe0;--br:#3d2b1f;--bl:#5c4a2a;--rd:#c62828;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Lato',sans-serif;background:linear-gradient(160deg,var(--cr) 0%,var(--cd) 100%);color:var(--br);min-height:100vh;padding-bottom:60px;}
body.ar{font-family:'Tajawal',sans-serif;}
.app-header{background:linear-gradient(160deg,var(--gd) 0%,var(--gm) 55%,var(--gl) 100%);padding:0 16px 0;box-shadow:0 4px 20px rgba(0,0,0,.25);}
.app-header-top{display:flex;align-items:center;justify-content:flex-end;padding:12px 0 8px;gap:8px;}
.lang-btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;}
.app-header-center{text-align:center;padding-bottom:14px;}
.app-icon{font-size:36px;display:block;margin-bottom:4px;}
.app-title{font-family:'Cormorant Garamond',serif;color:#fff;font-size:26px;font-weight:700;letter-spacing:1.5px;}
body.ar .app-title{font-family:'Tajawal',sans-serif;letter-spacing:0;}
.app-sub{color:#c8e6c9;font-size:11px;margin-top:3px;}
.app-warning{color:#ffecb3;font-size:10px;margin-top:7px;background:rgba(0,0,0,.2);padding:3px 12px;border-radius:20px;display:inline-block;}
.tabs{display:flex;justify-content:center;gap:5px;padding:12px 10px 8px;flex-wrap:wrap;position:sticky;top:0;z-index:50;background:linear-gradient(to bottom,var(--cr) 80%,transparent);}
.tab-btn{padding:8px 13px;border:none;border-radius:20px;cursor:pointer;font-size:12px;font-family:'Cormorant Garamond',serif;font-weight:600;transition:all .2s;}
body.ar .tab-btn{font-family:'Tajawal',sans-serif;font-size:12.5px;}
.tab-btn.active{background:var(--gm);color:#fff;box-shadow:0 4px 12px rgba(45,90,39,.4);transform:translateY(-1px);}
.tab-btn:not(.active){background:#fff;color:var(--gl);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.content{max-width:680px;margin:0 auto;padding:16px 14px 0;width:100%;}
.panel{display:none;animation:fadeIn .25s ease;padding-bottom:20px;}
.panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* RULES */
.rule-card{background:#fff;border-radius:12px;margin-bottom:8px;padding:13px 15px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid var(--gl);display:flex;gap:11px;align-items:flex-start;}
body.ar .rule-card{border-left:none;border-right:4px solid var(--gl);}
.rule-icon{font-size:21px;min-width:26px;line-height:1.1;}
.rule-title{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gm);font-size:14px;margin-bottom:2px;}
body.ar .rule-title{font-family:'Tajawal',sans-serif;}
.rule-body{color:var(--bl);font-size:12px;line-height:1.55;font-weight:300;}
body.ar .rule-body{font-size:12.5px;line-height:1.65;}
.cheat-sheet{background:linear-gradient(135deg,var(--gd),var(--gl));border-radius:14px;padding:18px;margin-top:16px;color:#fff;}
.cheat-sheet h3{font-family:'Cormorant Garamond',serif;text-align:center;font-size:17px;margin-bottom:12px;}
body.ar .cheat-sheet h3{font-family:'Tajawal',sans-serif;}
.cheat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.cheat-item{background:rgba(255,255,255,.13);border-radius:8px;padding:7px 9px;}
.cheat-label{font-size:11px;font-weight:700;}
.cheat-val{font-size:10.5px;opacity:.82;margin-top:1px;}
body.ar .cheat-val{font-size:11.5px;}

/* PLAN */
.regen-wrap{text-align:center;margin-bottom:14px;}
.badges{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.badge{border-radius:20px;padding:3px 11px;font-size:10.5px;border:1px solid;}
.badge-protein{background:var(--ap);border-color:var(--am);color:#7b5800;}
.badge-rest{background:var(--gp);border-color:#81c784;color:#2e7d32;}
.badge-gen{background:#e3f2fd;border-color:#90caf9;color:#1565c0;}
.day-toggle{display:flex;background:#fff;border-radius:24px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin:0 auto 12px;width:fit-content;gap:4px;}
.day-toggle-btn{padding:8px 16px;border:none;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;transition:all .2s;background:transparent;color:#888;}
.day-toggle-btn.active{background:var(--gm);color:#fff;box-shadow:0 2px 8px rgba(45,90,39,.35);}
body.ar .day-toggle-btn{font-family:'Tajawal',sans-serif;}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
.regen-btn{background:linear-gradient(135deg,var(--gm),var(--gl));color:#fff;border:none;border-radius:24px;padding:11px 22px;font-size:13px;font-family:'Cormorant Garamond',serif;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(45,90,39,.4);transition:all .2s;display:inline-flex;align-items:center;gap:7px;}
body.ar .regen-btn{font-family:'Tajawal',sans-serif;}
.regen-btn:disabled{background:#bbb;box-shadow:none;cursor:not-allowed;}
.export-btn{background:linear-gradient(135deg,#1565c0,#1976d2);color:#fff;border:none;border-radius:24px;padding:11px 22px;font-size:13px;font-family:'Cormorant Garamond',serif;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(21,101,192,.35);transition:all .2s;display:inline-flex;align-items:center;gap:7px;}
body.ar .export-btn{font-family:'Tajawal',sans-serif;}
.export-btn:hover{transform:translateY(-1px);}
.error-msg{color:var(--rd);font-size:11.5px;margin-top:7px;}
.day-card{background:#fff;border-radius:12px;margin-bottom:7px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.05);}
.day-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;}
.day-header-left{display:flex;align-items:center;gap:8px;}
.day-badge{color:#fff;border-radius:18px;padding:2px 9px;font-size:10px;font-weight:700;min-width:36px;text-align:center;}
.day-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:14px;color:#2d3748;}
body.ar .day-title{font-family:'Tajawal',sans-serif;}
.day-chevron{color:#bbb;font-size:12px;transition:transform .2s;}
.day-chevron.open{transform:rotate(180deg);}
.day-body{padding:0 14px 12px;display:none;}
.day-body.open{display:block;border-top:1px dashed;}
.meal-row{display:flex;gap:8px;margin-top:9px;align-items:flex-start;}
.meal-icon{font-size:14px;min-width:19px;}
.meal-label{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:1px;}
body.ar .meal-label{font-size:10px;letter-spacing:0;}
.meal-text{font-size:12px;color:var(--br);line-height:1.5;font-weight:300;}
body.ar .meal-text{font-size:12.5px;line-height:1.6;}
.protein{border:1px solid var(--am);}
.protein.open-card .day-header{background:var(--ap);}
.protein .day-badge{background:#a06200;}
.protein .day-body{border-color:var(--am);}
.rest{border:1px solid #81c784;}
.rest.open-card .day-header{background:var(--gp);}
.rest .day-badge{background:#2e7d32;}
.rest .day-body{border-color:#81c784;}

/* GROCERY */
.grocery-section{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 7px rgba(0,0,0,.06);}
.grocery-header{background:linear-gradient(90deg,var(--gd),var(--gl));padding:9px 14px;}
.grocery-header h3{color:#fff;font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;}
body.ar .grocery-header h3{font-family:'Tajawal',sans-serif;}
.grocery-note{color:#c8e6c9;font-size:10px;margin-top:1px;}
.grocery-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;transition:background .15s;border-bottom:1px solid #f5f0e8;}
.grocery-item:last-child{border-bottom:none;}
.grocery-item.checked{background:#f1f8e9;}
.grocery-left{display:flex;align-items:center;gap:9px;}
.checkbox{width:19px;height:19px;border-radius:5px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;min-width:19px;transition:all .15s;}
.checkbox.checked{border:none;background:var(--gl);}
.checkbox-tick{color:#fff;font-size:11px;font-weight:700;display:none;}
.checkbox.checked .checkbox-tick{display:block;}
.item-name{font-size:12.5px;transition:all .15s;}
.item-name.checked{color:#aaa;text-decoration:line-through;}
.item-qty{font-size:11px;font-weight:700;color:var(--gl);min-width:46px;text-align:right;}
body.ar .item-qty{text-align:left;}
.item-qty.checked{color:#ccc;}

/* TRAVEL */
.travel-card{background:#fff;border-radius:13px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 7px rgba(0,0,0,.07);}
.travel-header{padding:11px 15px;}
.travel-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:15px;color:#2d3748;}
body.ar .travel-title{font-family:'Tajawal',sans-serif;}
.travel-body{padding:12px 15px;}
.travel-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.col-title{font-size:11px;font-weight:700;margin-bottom:6px;}
.do-title{color:#2e7d32;}
.dont-title{color:var(--rd);}
.travel-item{display:flex;gap:5px;margin-bottom:5px;align-items:flex-start;}
.travel-text{font-size:11.5px;line-height:1.4;}
body.ar .travel-text{font-size:12px;line-height:1.55;}
.phrase-row{margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #f5f5f5;}
.phrase-row:last-child{border-bottom:none;margin:0;padding:0;}
.phrase-label{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:2px;}
body.ar .phrase-label{font-size:10px;letter-spacing:0;}
.phrase-text{font-size:12px;color:var(--gm);font-style:italic;}
body.ar .phrase-text{font-style:normal;font-size:12.5px;}
.golden-rule{background:linear-gradient(135deg,var(--gd),var(--gl));border-radius:13px;padding:16px 18px;color:#fff;margin-top:4px;}
.golden-rule h3{font-family:'Cormorant Garamond',serif;font-size:17px;text-align:center;margin-bottom:9px;}
body.ar .golden-rule h3{font-family:'Tajawal',sans-serif;}
.golden-rule p{font-size:12px;line-height:1.7;color:#c8e6c9;}
body.ar .golden-rule p{font-size:12.5px;}
.golden-rule strong{color:#fff;}
.golden-box{margin-top:10px;background:rgba(255,255,255,.12);border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.65;color:#e8f5e9;}

/* FOOD CHECKER */
.checker-wrap{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:16px;}
.checker-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--gm);text-align:center;margin-bottom:6px;}
body.ar .checker-title{font-family:'Tajawal',sans-serif;}
.checker-sub{font-size:12px;color:#888;text-align:center;margin-bottom:16px;}
body.ar .checker-sub{font-size:13px;}
.checker-input-row{display:flex;gap:8px;}
.checker-input{flex:1;padding:12px 16px;border:1.5px solid #ddd;border-radius:12px;font-size:14px;font-family:inherit;color:var(--br);outline:none;transition:border .2s;}
.checker-input:focus{border-color:var(--gm);}
.checker-btn{background:var(--gm);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;white-space:nowrap;transition:all .2s;}
.checker-btn:disabled{background:#bbb;cursor:not-allowed;}
.checker-result{margin-top:14px;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6;display:none;}
body.ar .checker-result{font-size:13.5px;line-height:1.7;}
.result-allowed{background:#e8f5e9;border:1px solid #81c784;color:#1b5e20;}
.result-forbidden{background:#ffebee;border:1px solid #ef9a9a;color:#b71c1c;}
.result-caution{background:#fff8e1;border:1px solid #ffe082;color:#6d4c00;}
.result-icon{font-size:28px;display:block;text-align:center;margin-bottom:8px;}
.result-text{text-align:center;}
.checker-history{margin-top:16px;}
.history-title{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;}
.history-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;margin-bottom:4px;background:#f9f7f3;font-size:12px;}
.history-dot{width:10px;height:10px;border-radius:50%;min-width:10px;}
.dot-ok{background:#4a7c3f;}
.dot-no{background:#c62828;}
.dot-maybe{background:#f4a200;}

/* API BOX */
.api-box{background:#fffde7;border:1px solid #f9a825;border-radius:11px;padding:13px 15px;margin-bottom:14px;font-size:11.5px;}
.api-box p{color:#5d4037;margin-bottom:7px;line-height:1.55;}
body.ar .api-box p{font-size:12.5px;}
.api-box a{color:var(--gm);font-weight:700;}
.api-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.api-input{flex:1;min-width:160px;padding:8px 11px;border-radius:8px;border:1px solid #ddd;font-size:12px;font-family:monospace;background:#fff;color:#333;}
.api-save{background:var(--gm);color:#fff;border:none;border-radius:8px;padding:8px 13px;font-size:12px;cursor:pointer;white-space:nowrap;}
.api-status{font-size:11px;margin-top:5px;}
.api-status.ok{color:#2e7d32;}
.api-status.no{color:#888;}

/* INFO BOXES */
.info-box{border-radius:9px;padding:10px 13px;font-size:11.5px;line-height:1.6;}
body.ar .info-box{font-size:12.5px;line-height:1.75;}
.info-amber{background:var(--ap);border:1px solid var(--am);color:#7b5800;}
.info-green{background:var(--gp);border:1px solid #81c784;color:#2e7d32;}
.info-blue{background:#e3f2fd;border:1px solid #90caf9;color:#1565c0;}
.intro-text{color:var(--bl);text-align:center;font-style:italic;font-size:12.5px;margin-bottom:14px;line-height:1.5;}
body.ar .intro-text{font-style:normal;font-size:13px;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;animation:spin .9s linear infinite;}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-header-top">
    <button class="lang-btn" onclick="toggleLang()" id="lang-btn">العربية</button>
  </div>
  <div class="app-header-center">
    <span class="app-icon">🌿</span>
    <div class="app-title" id="app-title">Al-Tayyibat System</div>
    <div class="app-sub" id="app-sub">Dr. Diaa Al-Awady · Morocco Edition</div>
    <div class="app-warning" id="app-warning">⚠️ Consult your doctor before any dietary change</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('rules')" id="tab-rules">📋 Rules</button>
  <button class="tab-btn" onclick="switchTab('plan')" id="tab-plan">📅 Meal Plan</button>
  <button class="tab-btn" onclick="switchTab('grocery')" id="tab-grocery">🛒 Groceries</button>
  <button class="tab-btn" onclick="switchTab('travel')" id="tab-travel">✈️ Travel</button>
  <button class="tab-btn" onclick="switchTab('checker')" id="tab-checker">🔍 Food Check</button>
</div>

<div class="content">
  <div id="panel-rules" class="panel active"></div>
  <div id="panel-plan" class="panel"></div>
  <div id="panel-grocery" class="panel"></div>
  <div id="panel-travel" class="panel"></div>
  <div id="panel-checker" class="panel"></div>
</div>

<script>
/* ═══════════ STATE ═══════════ */
let lang = localStorage.getItem('tt_lang') || 'en';
let startType = localStorage.getItem('tt_startType') || 'protein';
let generation = parseInt(localStorage.getItem('tt_generation') || '1');
let checkedItems = JSON.parse(localStorage.getItem('tt_checked') || '{}');
let currentPlan = JSON.parse(localStorage.getItem('tt_currentPlan') || 'null');
let currentGrocery = JSON.parse(localStorage.getItem('tt_currentGrocery') || 'null');
let openDay = null;
let checkerHistory = JSON.parse(localStorage.getItem('tt_checkerHistory') || '[]');

function persist() {
  localStorage.setItem('tt_lang', lang);
  localStorage.setItem('tt_startType', startType);
  localStorage.setItem('tt_generation', generation);
  localStorage.setItem('tt_checked', JSON.stringify(checkedItems));
  localStorage.setItem('tt_currentPlan', JSON.stringify(currentPlan));
  localStorage.setItem('tt_currentGrocery', JSON.stringify(currentGrocery));
  localStorage.setItem('tt_checkerHistory', JSON.stringify(checkerHistory));
}

/* ═══════════ DATA ═══════════ */
const DATA = {

/* ── EXPORT TO SHEETS ── */
function exportToSheets(){
  const d = t();
  const plan = getActivePlan();
  const headers = d.exportHeaders;
  const rows = plan.map(day => [
    `${d.dayLabel} ${day.day}`,
    day.type === 'PROTEIN' ? (lang==='ar'?'يوم بروتين':'Protein Day') : (lang==='ar'?'يوم راحة':'Rest Day'),
    day.protein || '—',
    day.breakfast, day.lunch, day.dinner, day.snacks
  ]);
  const csv = [headers, ...rows]
    .map(r => r.map(cell => `"${(cell||'').replace(/"/g,'""')}"`).join(','))
    .join('\n');

  // Show modal with copy button (works on iOS + all browsers)
  showExportModal(csv);
}

function copyCSV(){
  const csv = window._exportCSV || '';

    if(confirm) confirm.textContent = isAr?'الآن افتح Google Sheets والصق في الخلية A1':'Now open Google Sheets and paste into cell A1';
  }).catch(()=>{
    // Fallback: select the textarea
    const ta = document.getElementById('csv-data');
    if(ta){ ta.select(); ta.setSelectionRange(0,99999); document.execCommand('copy');
      btn.textContent = '✅ ' + (isAr?'تم النسخ!':'Copied!');

async function checkFood(){
  const input = document.getElementById('checker-input');
  const food = input.value.trim();
  if(!food) return;
  const apiKey = localStorage.getItem('tt_apikey') || '';
  const btn = document.getElementById('checker-btn');
  const result = document.getElementById('checker-result');
  if(!apiKey){
    result.className = 'checker-result result-caution';
    result.style.display = 'block';
    result.innerHTML = `<div class="result-icon">⚠️</div><div class="result-text">${lang==='ar'?'الرجاء حفظ مفتاح API في تبويب خطة الوجبات أولاً.':'Please save your API key in the Meal Plan tab first.'}</div>`;
    return;
  }
  btn.disabled = true;
  btn.textContent = '...';
  result.style.display = 'none';

  const sysPrompt = `You are an expert on the Al-Tayyibat dietary system by Dr. Diaa Al-Awady.
When asked about a food, respond with ONLY a raw JSON object. No markdown, no backticks, no extra text.
Use this exact format: {"status":"allowed","icon":"OK","short":"Allowed","reason":"reason here"}
Rules:
- status must be exactly one of: allowed, forbidden, caution
- icon: use the word OK for allowed, NO for forbidden, MAYBE for caution
- short: 1-3 words
- reason: max 20 words, in the same language as the question
- caution means: rarely allowed or depends on preparation method`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,system:sysPrompt,messages:[{role:'user',content:`Is this allowed in Al-Tayyibat: ${food}`}]})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    if(!data.content) throw new Error('No response from API. Check your key.');
    const raw = data.content.map(i=>i.text||'').join('').replace(/```json\n?|```\n?/g,'').trim();
    // Extract JSON using first { and last } — most robust approach
    const start = raw.indexOf('{');
    const end = raw.lastIndexOf('}');
    if(start === -1 || end === -1 || end <= start) throw new Error('Could not read response. Try again.');
    const parsed = JSON.parse(raw.slice(start, end+1));
    // Map icon words to emojis
    const iconMap = {OK:'✅', NO:'❌', MAYBE:'⚠️'};
    const icon = iconMap[parsed.icon] || (parsed.status==='allowed'?'✅':parsed.status==='forbidden'?'❌':'⚠️');
    const cls = parsed.status==='allowed' ? 'result-allowed' : parsed.status==='forbidden' ? 'result-forbidden' : 'result-caution';
    result.className = `checker-result ${cls}`;
    result.style.display = 'block';
    result.innerHTML = `<div class="result-icon">${icon}</div><div class="result-text"><strong>${parsed.short}</strong><br>${parsed.reason}</div>`;
    checkerHistory.push({food, status: parsed.status});
    if(checkerHistory.length > 20) checkerHistory = checkerHistory.slice(-20);
    input.value = '';
    persist();
    renderChecker();
  } catch(err) {
    result.className = 'checker-result result-caution';
    result.style.display = 'block';
    result.innerHTML = `<div class="result-icon">⚠️</div><div class="result-text">${err.message||'Error, please try again.'}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = t().checkerBtnLabel;
  }
}

  if(!apiKey){if(errEl){errEl.style.color='';errEl.textContent=lang==='ar'?'الرجاء إدخال مفتاح API أولاً.':'Please enter your API key first.';}return;}
  const b1=document.getElementById('regen-btn-plan'),b2=document.getElementById('regen-btn-grocery');

  if(b2){b2.disabled=true;b2.innerHTML='<span style="display:inline-block;animation:spin .9s linear infinite">⏳</span> '+loading;}
  if(errEl){errEl.style.color='';errEl.textContent='';}
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,system:SYS,messages:[{role:'user',content:'Fresh 15-day plan, generation #'+(generation+1)+'. Start type: '+startType+'. Vary recipes. JSON only.'}]})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    const text = data.content.map(i=>i.text||'').join('');
    const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
    currentPlan = parsed.mealPlan;
    currentGrocery = parsed.groceryList;
    checkedItems = {};
    generation++;
    openDay = null;
    persist();
    renderPlan(); renderGrocery();
  }catch(err){
    if(errEl){errEl.style.color='';errEl.textContent=(lang==='ar'?'خطأ: ':'Error: ')+(err.message||'Try again.');}
  }finally{
    const b1=document.getElementById('regen-btn-plan'),b2=document.getElementById('regen-btn-grocery');
    if(b1){b1.disabled=false;b1.innerHTML=t().regenBtn;}
    if(b2){b2.disabled=false;b2.innerHTML='🔄 '+(lang==='ar'?'تجديد الخطة وقائمة التسوق':'Regenerate Plan & List');}
  }
}

/* ── TABS ── */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const ids=['rules','plan','grocery','travel','checker'];
  document.querySelectorAll('.tab-btn')[ids.indexOf(tab)].classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
